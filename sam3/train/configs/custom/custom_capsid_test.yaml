# @package _global_
defaults:
  - _self_

# ============================================================================
# python sam3/train/train.py -c configs/custom/custom_capsid_test.yaml --data-root /mnt/forli/group/qtallon/sam/coco/capsid_data_dir/ --experiment-log-dir /mnt/forli/group/qtallon/sam/logs/capsid_log_dir/ --supercategory supercategory_name
# ============================================================================

paths:
  data_root: data
  annotations_name: coco_annotations.json
  experiment_log_dir: logs
  checkpoint_path: null
  bpe_path: sam3/assets/bpe_simple_vocab_16e6.txt.gz

# Custom dataset configuration
custom_train:
  num_images: null
  supercategory: ${all_supercategories.${string:${submitit.job_array.task_index}}}

  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI # Apply a list of datapoint transforms sequentially.
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries # Filter find/get queries and clean up unused objects/images.
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds # Filter out crowd-labeled targets.
        - _target_: sam3.train.transforms.segmentation.DecodeRle # Decode RLE masks into uint8 tensors.
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI # Randomly resize images (optionally consistent per datapoint).
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales # Build the list of candidate resize scales.
            size: ${scratch.resolution}
            min_size: 64
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size # Compute max size for aspect-ratio constraint.
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI # Pad images to a target square size.
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI # Convert images to torch tensors.
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries # Filter find/get queries and clean up unused objects/images.
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets # Drop zero-area targets.
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI # Normalize images and normalize boxes/points to [0,1].
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries # Filter find/get queries and clean up unused objects/images.
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets # Drop zero-area targets.
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries # Filter find/get queries and clean up unused objects/images.
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut # Drop find queries with too many outputs.
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI # Apply a list of datapoint transforms sequentially.
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle # Decode RLE masks into uint8 tensors.
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI # Randomly resize images (optionally consistent per datapoint).
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size # Compute max size for aspect-ratio constraint.
            size: ${scratch.resolution}
          square: true
          consistent_transform: false
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI # Convert images to torch tensors.
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI # Normalize images and normalize boxes/points to [0,1].
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper # Compute SAM3 losses over outputs/aux using matchers.
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher # Greedy one-to-many matcher for o2m outputs.
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes # L1 + GIoU box regression losses.
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr # BCE/focal classification loss with IoU-weighted positives.
        weak_loss: false
        weight_dict:
          loss_ce: 20.0 # Another option is 100.0
          presence_loss: 20.0
        pos_weight: 10.0 # Another option is 5.0
        alpha: 0.25
        gamma: 2
        use_presence: true  # Change
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks # Mask focal + dice losses.
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion # Semantic segmentation loss (focal/BCE + dice + presence).
      presence_head: true
      presence_loss: false  # Change
      focal: true
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: false
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Different helper parameters and functions
# ============================================================================

scratch:
  enable_segmentation: true
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine # Sine/cosine positional encoding for images.
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: true
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage # Convert model outputs to COCO-format predictions.
    max_dets_per_img: -1  # infinite detections
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  original_mask_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage # Convert model outputs to COCO-format mask predictions.
    max_dets_per_img: -1  # infinite detections
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    convert_mask_to_rle: true
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2 # Hungarian one-to-one matcher using class/box/GIoU costs.
    focal: true  # with `focal: true` it is equivalent to BinaryFocalHungarianMatcher
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: false
  scale_by_find_batch_size: true

  # Image processing parameters
  resolution: 1008
  consistent_transform: false
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 4
  num_val_workers: 2
  max_data_epochs: 20
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 3
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api # Collate datapoints into batched tensors and queries.
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: custom
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

  gradient_accumulation_steps: 1
  train_batch_size: 3
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api # Collate datapoints into batched tensors and queries.
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:

  _target_: sam3.train.trainer.Trainer # Training loop with DDP, logging, and checkpoints.
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: false
  max_epochs: 20
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 5
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: true
    gradient_as_bucket_view: true

  loss:
    all: ${custom_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss # Zero loss placeholder.

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset # DataLoader wrapper with optional distributed sampler.
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset # COCO-based dataset emitting SAM3 datapoints.
        limit_ids: ${custom_train.num_images}
        transforms: ${custom_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: true # Speed?
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON # Load COCO JSON and build per-category queries.
          include_negatives: true
          category_chunk_size: 2 # Note: You can increase this based on the memory of your GPU.
          _partial_: true
        img_folder: ${paths.data_root}/${custom_train.supercategory}/train/
        ann_file: ${paths.data_root}/${custom_train.supercategory}/train/${paths.annotations_name}

      shuffle: true
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: false
      drop_last: true
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset # DataLoader wrapper with optional distributed sampler.
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset # COCO-based dataset emitting SAM3 datapoints.
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON # Load COCO JSON and build per-category queries.
          include_negatives: true
          category_chunk_size: 2 # Note: You can increase this based on the memory of your GPU.
          _partial_: true
        img_folder: ${paths.data_root}/${custom_train.supercategory}/test/
        ann_file: ${paths.data_root}/${custom_train.supercategory}/test/${paths.annotations_name}
        transforms: ${custom_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: false
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: true
      drop_last: false
      collate_fn: ${scratch.collate_fn_val}


  model:
    _target_: sam3.model_builder.build_sam3_image_model # Build SAM3 image model and load checkpoint.
    bpe_path: ${paths.bpe_path}
    device: cuda
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation} # Warning: Enable this if using segmentation.
    checkpoint_path: ${paths.checkpoint_path}
    load_from_HF: true

  meters:
    val:
      custom:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper # Postprocess outputs and dump COCO predictions.
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/custom/${custom_train.supercategory}
          merge_predictions: true
          postprocessor: ${scratch.original_mask_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.data_root}/${custom_train.supercategory}/test/${paths.annotations_name}
              tide: false
              iou_type: "segm"

  optim:
    amp:
      enabled: true
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW # PyTorch AdamW optimizer (external).

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper # Clip gradients by norm for stability.
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier # Apply layer-wise LR decay to param groups.
        _partial_: true
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:  # transformer and class_embed
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler # Inverse-sqrt LR schedule with warmup/cooldown.
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler # Inverse-sqrt LR schedule with warmup/cooldown.
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler # Inverse-sqrt LR schedule with warmup/cooldown.
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler # Constant parameter schedule (fvcore).
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler # Constant parameter schedule (fvcore).
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 5  # 0 only last checkpoint is saved.

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger # Create a TensorBoard logger.
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: true
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/${custom_train.supercategory}
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: false
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
  job_array:
    num_tasks: 100
    task_index: 0

# ============================================================================
# Available Supercategories
# ============================================================================

all_supercategories:
  - fill
